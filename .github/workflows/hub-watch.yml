name: 허브 자동 점검

on:
  schedule:
    - cron: "0 22 * * *"      # 매일 07:00 KST (UTC 22:00)
  workflow_dispatch:           # 수동 실행도 가능

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 점검 실행
        id: chk
        env:
          SB_URL: https://xaclqvveppvccdpebzsz.supabase.co
          SB_ANON: ${{ secrets.SB_ANON_KEY }}
          SITE: https://hyunjeongshin83.github.io/CampusTownHub
        run: python3 scripts/hub_watch.py

      - name: 브라우저 설치
        run: |
          pip install playwright --quiet
          python3 -m playwright install chromium --with-deps

      - name: 브라우저 점검 (실제 크롬으로 렌더링·오류 확인)
        id: bchk
        env:
          SITE: https://hyunjeongshin83.github.io/CampusTownHub
        run: python3 scripts/browser_check.py

      - name: 화면 캡처 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-screenshot
          path: hub.png
          retention-days: 14

      - name: 리포트 합치기
        if: always()
        run: cat browser-report.md >> watch-report.md || true

      - name: 문제 발견 시 이슈 등록·갱신
        id: issue
        if: steps.chk.outputs.status != 'ok' || steps.bchk.outputs.bstatus != 'ok'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('watch-report.md', 'utf8');
            const title = '[자동점검] 허브 이상 감지';
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'auto-watch'
            });
            if (issues.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues[0].number, body
              });
              core.setOutput('created', 'false');
              core.setOutput('url', issues[0].html_url);
            } else {
              const {data: made} = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['auto-watch']
              });
              core.setOutput('created', 'true');
              core.setOutput('url', made.html_url);
            }

      # 새로 발생한 이상일 때만 카톡으로 알린다 (같은 문제 반복 시 도배 방지)
      - name: 카카오톡 알림
        if: (steps.chk.outputs.status != 'ok' || steps.bchk.outputs.bstatus != 'ok') && steps.issue.outputs.created == 'true'
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          SITE: https://hyunjeongshin83.github.io/CampusTownHub
          ISSUE_URL: ${{ steps.issue.outputs.url }}
        run: python3 scripts/kakao_notify.py

      - name: 정상 복구 시 이슈 닫기
        if: steps.chk.outputs.status == 'ok' && steps.bchk.outputs.bstatus == 'ok'
        uses: actions/github-script@v9
        with:
          script: |
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'auto-watch'
            });
            for (const i of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, body: '자동 점검 결과 정상으로 돌아와 닫습니다.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, state: 'closed'
              });
            }
