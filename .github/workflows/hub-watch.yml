name: 허브 자동 점검

on:
  schedule:
    - cron: "0 22 * * *"      # 매일 07:00 KST — 아침 보고용
    - cron: "0 10 * * *"      # 매일 19:00 KST — 낮에 들어간 수정을 저녁에 한 번 더
  push:                        # 배포 직후 바로 — 하얀 화면으로 몇십 분 있는 일이 없게
    branches: [main]
    paths:
      - "index.html"
      - "recover.html"
      - "motioncam.html"
      - "scripts/**"
  workflow_dispatch:           # 수동 실행도 가능

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 점검 실행
        id: chk
        env:
          SB_URL: https://xaclqvveppvccdpebzsz.supabase.co
          SB_ANON: ${{ secrets.SB_ANON_KEY }}
          SITE: https://hyunjeongshin83.github.io/CampusTownHub
        run: python3 scripts/hub_watch.py

      - name: 브라우저 설치
        run: |
          pip install playwright --quiet
          python3 -m playwright install chromium --with-deps

      - name: 브라우저 점검 (실제 크롬으로 렌더링·오류 확인)
        id: bchk
        env:
          SITE: https://hyunjeongshin83.github.io/CampusTownHub
        run: python3 scripts/browser_check.py

      - name: 화면 캡처 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-screenshot
          path: hub.png
          retention-days: 14

      - name: 역할별 QA (임의 계정 4명)
        id: qarole
        continue-on-error: true
        env:
          SITE: https://hyunjeongshin83.github.io/CampusTownHub
        run: |
          python3 scripts/qa_roles.py 2>&1 | tee qa-roles.txt
          echo "rc=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: 모션캠 QA (합성 얼굴)
        id: qamotion
        continue-on-error: true
        env:
          SITE: https://hyunjeongshin83.github.io/CampusTownHub
        run: |
          pip install pillow numpy --quiet
          python3 scripts/qa_motioncam.py 2>&1 | tee qa-motion.txt
          echo "rc=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: 핸들러·렌더 점검
        id: qahandler
        continue-on-error: true
        env:
          SITE: https://hyunjeongshin83.github.io/CampusTownHub
        run: |
          python3 scripts/qa_handlers.py 2>&1 | tee qa-handler.txt
          echo "rc=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: 보안 기본값 점검
        id: qasec
        continue-on-error: true
        env:
          SITE: https://hyunjeongshin83.github.io/CampusTownHub
        run: |
          python3 scripts/qa_security.py 2>&1 | tee qa-security.txt
          echo "rc=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: 기능 훑기 (누를 수 있는 것 전부)
        id: qacrawl
        continue-on-error: true
        env:
          SITE: https://hyunjeongshin83.github.io/CampusTownHub
          CRAWL_SEC: "400"
          CRAWL_MAX: "60"
        run: |
          python3 scripts/qa_crawl.py 2>&1 | tee qa-crawl.txt
          echo "rc=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: 동시 저장 검사
        id: qamerge
        continue-on-error: true
        env:
          SITE: https://hyunjeongshin83.github.io/CampusTownHub
        run: |
          python3 scripts/qa_merge.py 2>&1 | tee qa-merge.txt
          echo "rc=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: 리포트 합치기
        if: always()
        run: |
          cat browser-report.md >> watch-report.md || true
          {
            echo ""
            echo "### 역할별 QA"
            echo '```'
            tail -24 qa-roles.txt 2>/dev/null || echo "(실행 안 됨)"
            echo '```'
            echo ""
            echo "### 모션캠 QA"
            echo '```'
            tail -12 qa-motion.txt 2>/dev/null || echo "(실행 안 됨)"
            echo '```'
            for f in "핸들러·렌더:qa-handler.txt" "보안 기본값:qa-security.txt" "기능 훑기:qa-crawl.txt" "동시 저장:qa-merge.txt"; do
              echo ""; echo "### ${f%%:*}"; echo '```'
              tail -20 "${f##*:}" 2>/dev/null || echo "(실행 안 됨)"
              echo '```'
            done
          } >> watch-report.md

      - name: 문제 발견 시 이슈 등록·갱신
        id: issue
        if: steps.chk.outputs.status == 'ng' || steps.bchk.outputs.bstatus == 'ng' || steps.qarole.outputs.rc == '1' || steps.qamotion.outputs.rc == '1' || steps.qahandler.outputs.rc == '1' || steps.qasec.outputs.rc == '1' || steps.qacrawl.outputs.rc == '1' || steps.qamerge.outputs.rc == '1'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('watch-report.md', 'utf8');
            const title = '[자동점검] 허브 이상 감지';
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'auto-watch'
            });
            if (issues.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues[0].number, body
              });
              core.setOutput('created', 'false');
              core.setOutput('url', issues[0].html_url);
            } else {
              const {data: made} = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['auto-watch']
              });
              core.setOutput('created', 'true');
              core.setOutput('url', made.html_url);
            }

      # 새로 발생한 이상일 때만 카톡으로 알린다 (같은 문제 반복 시 도배 방지)
      - name: 카카오톡 알림
        if: (steps.chk.outputs.status == 'ng' || steps.bchk.outputs.bstatus == 'ng' || steps.qarole.outputs.rc == '1' || steps.qamotion.outputs.rc == '1' || steps.qahandler.outputs.rc == '1' || steps.qasec.outputs.rc == '1' || steps.qacrawl.outputs.rc == '1' || steps.qamerge.outputs.rc == '1') && steps.issue.outputs.created == 'true'
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          SITE: https://hyunjeongshin83.github.io/CampusTownHub
          ISSUE_URL: ${{ steps.issue.outputs.url }}
        run: python3 scripts/kakao_notify.py

      - name: 정상 복구 시 이슈 닫기
        if: steps.chk.outputs.status != 'ng' && steps.bchk.outputs.bstatus != 'ng' && steps.qarole.outputs.rc != '1' && steps.qamotion.outputs.rc != '1' && steps.qahandler.outputs.rc != '1' && steps.qasec.outputs.rc != '1' && steps.qacrawl.outputs.rc != '1' && steps.qamerge.outputs.rc != '1'
        uses: actions/github-script@v9
        with:
          script: |
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'auto-watch'
            });
            for (const i of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, body: '자동 점검 결과 정상으로 돌아와 닫습니다.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, state: 'closed'
              });
            }
